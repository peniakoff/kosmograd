name: Validate prototype

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile tools/validate_workshop.py tools/p0_harness.py
      - name: Test P0 harness
        run: python -m unittest discover -s tests
      - name: Validate prototype catalog
        run: python tools/validate_workshop.py --prototype
